<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas · Centro Básico General El Jiral</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #4b3fb3, #2f7bd1);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px 12px;
    }
    .tarjeta-principal {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .encabezado-tareas {
        background: linear-gradient(90deg, #3a6fd8, #5a4fcf);
        color: #fff;
        padding: 18px 24px;
        text-align: center;
    }
    .encabezado-tareas h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .barra-acciones { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #eee; }
    .zona-form { padding: 20px 24px; border-bottom: 1px solid #eee; display: none; }
    .zona-form.mostrar { display: block; }
    .zona-form label { font-size: .85rem; font-weight: 600; margin-top: 10px; display: block; }
    .zona-form input, .zona-form select, .zona-form textarea {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 4px;
    }
    .acciones-form { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .lista-tareas { padding: 16px 24px; }
    .tarjeta-tarea {
        border: 1px solid #eee; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
        display: flex; flex-direction: column; gap: 6px;
    }
    .tarjeta-tarea h3 { font-size: 1.02rem; margin: 0; color: #2f3ea3; }
    .tarjeta-tarea .meta { font-size: .82rem; color: #666; }
    .barra-progreso { background: #eee; border-radius: 6px; overflow: hidden; height: 10px; margin-top: 4px; }
    .barra-progreso .relleno { background: #28a745; height: 100%; }
    .fila-acciones-tarea { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    #estadoTareas { text-align: center; padding: 6px 24px 16px; font-size: .85rem; min-height: 20px; }
</style>
</head>
<body>

<div class="tarjeta-principal">
    <div class="encabezado-tareas">
        <h1>📚 TAREAS 🚀</h1>
    </div>

    <div class="barra-acciones">
        <a href="profesor.html" class="btn btn-outline-secondary btn-sm">↩️ Regresar a Docente</a>
        <button class="btn btn-primary btn-sm" id="btnMostrarForm">➕ Nueva tarea</button>
    </div>

    <div class="zona-form" id="zonaForm">
        <label>Título</label>
        <input type="text" id="inputTitulo" placeholder="Ej: Investigación de ecosistemas">

        <label>Materia</label>
        <input type="text" id="inputMateria" placeholder="Ej: Naturales">

        <label>Salón (se asignará a todos los estudiantes de ese salón)</label>
        <select id="selectSalon">
            <option value="">Cargando salones...</option>
        </select>

        <label>Descripción (opcional)</label>
        <textarea id="inputDescripcion" rows="3" placeholder="Detalles de la tarea"></textarea>

        <label>Fecha de entrega</label>
        <input type="date" id="inputFecha">

        <label>Hora de entrega (opcional)</label>
        <input type="time" id="inputHora">

        <div class="acciones-form">
            <button class="btn btn-sm btn-outline-secondary" id="btnCancelarForm">Cancelar</button>
            <button class="btn btn-sm btn-primary" id="btnGuardarTarea">Guardar tarea</button>
        </div>
    </div>

    <div class="lista-tareas" id="listaTareas">
        <p class="text-center text-muted py-4">Cargando tareas...</p>
    </div>

    <div id="estadoTareas"></div>
</div>

<script type="module" src="../js/tareas.js"></script>
</body>
</html>
