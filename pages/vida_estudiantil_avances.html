<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<body>
<header class="ve-top"><div class="ve-wrap ve-top-row">

<nav class="ve-nav"><a href="vida_estudiantil.html">← Vida estudiantil</a><a href="vida_estudiantil_admin.html">Revisar archivos</a><a href="vida_estudiantil_galeria.html">Galería</a></nav>

<main class="ve-wrap ve-main">
<div id="mensajeAvances" class="ve-alert" role="alert"></div>
<section class="ve-intro av-resumen">

<div id="totalesAvances" class="ve-progress-text">Cargando…</div>

<section class="av-toolbar">

<option value="completos">Completos (13/13)</option>

<div id="resumenSalon" class="av-resumen-salon"></div>

</main>
<div class="av-modal" id="modalFotos"><div class="av-modal-box">
<button class="av-cerrar" id="cerrarFotos" aria-label="Cerrar">×</button>
