<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Clase</title>
<link rel="stylesheet" href="../css/portal-clase.css">
</head>
<body>

<div class="portal-wrap">

  <header class="portal-header">
    <div>
      <p class="eyebrow">Prof. Samuel</p>
      <h1>Portal de Clase</h1>
    </div>
    <div class="header-botones">
      <a class="volver-index" href="../index.html">← Inicio</a>
    </div>
  </header>

  <!-- ---------- Vista: lista de clases ---------- -->
  <main id="vista-clases">

    <section class="materia-group" data-materia="Ciencias Naturales">
      <h2>Ciencias Naturales</h2>
      <div class="grid">
        <button class="folder-card" data-materia="Ciencias Naturales" data-grado="9A">
          <span class="tab">9A</span>
          <p class="materia-nombre">Ciencias Naturales</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
        <button class="folder-card" data-materia="Ciencias Naturales" data-grado="9B">
          <span class="tab">9B</span>
          <p class="materia-nombre">Ciencias Naturales</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
        <button class="folder-card" data-materia="Ciencias Naturales" data-grado="9C">
          <span class="tab">9C</span>
          <p class="materia-nombre">Ciencias Naturales</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
        <button class="folder-card" data-materia="Ciencias Naturales" data-grado="8A">
          <span class="tab">8A</span>
          <p class="materia-nombre">Ciencias Naturales</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
      </div>
    </section>

    <section class="materia-group" data-materia="Informática">
      <h2>Informática</h2>
      <div class="grid">
        <button class="folder-card" data-materia="Informática" data-grado="8A">
          <span class="tab">8A</span>
          <p class="materia-nombre">Informática</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
        <button class="folder-card" data-materia="Informática" data-grado="8B">
          <span class="tab">8B</span>
          <p class="materia-nombre">Informática</p>
          <p class="conteo" data-conteo>cargando…</p>
        </button>
      </div>
    </section>

  </main>

  <!-- ---------- Vista: dentro de una materia+grado ---------- -->
  <section id="vista-tareas" class="vista-tareas oculto">
    <button id="btn-volver">← Volver a las clases</button>
    <div id="ficha-clase" class="ficha-clase"></div>

    <!-- Paso 2: lista de "Clase 1", "Clase 2"... (y Examen final) -->
    <div id="vista-lista-clases">
      <h3 class="material-titulo">Clases</h3>
      <div id="lista-clases-grid" class="clases-grid"></div>
    </div>

    <!-- Paso 3: detalle de UNA clase (sus lecciones + sus tareas) -->
    <div id="vista-detalle-clase" class="oculto">
      <button id="btn-volver-clase">← Volver a la lista de clases</button>
      <div id="detalle-clase"></div>
      <hr class="separador-tareas" id="separador-tareas">
      <h3 class="material-titulo" id="titulo-tareas">📚 Tareas</h3>
      <div id="selector-estudiante"></div>
      <div id="lista-tareas"></div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/portal-config.js"></script>
<script src="../js/portal-clase.js"></script>
</body>
</html>
