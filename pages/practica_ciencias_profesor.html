<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prácticas de Ciencias Naturales | Panel del Docente</title>

    <link rel="icon" type="image/x-icon" href="../img/profesor-favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/profesor-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/profesor-favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/profesor-apple-touch-icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/temas.css">

    <style>
        html, body { max-width: 100%; overflow-x: hidden; }

        body.tema-docente {
            font-family: 'Inter', sans-serif;
            background: var(--color-fondo);
            color: var(--color-texto, #1e293b);
        }

        h1, h2, h3, .pcp-titulo { font-family: 'Baloo 2', sans-serif; }

        .pcp-header {
            background: var(--color-primario);
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pcp-header h1 {
            font-size: 1.15rem;
            margin: 0;
        }

        .pcp-header p {
            margin: 2px 0 0;
            font-size: .85rem;
            opacity: .85;
        }

        .pcp-contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .pcp-panel {
            background: var(--color-panel, #fff);
            border: 1px solid var(--color-borde);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .chips-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-opcion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--color-borde);
            background: #fff;
            color: #1e293b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .chip-opcion:hover { border-color: var(--color-primario); }

        .chip-opcion.chip-activa {
            background: var(--color-primario-claro, #e8ecfb);
            border-color: var(--color-primario);
            color: var(--color-primario-oscuro, var(--color-primario));
        }

        table.pcp-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        table.pcp-tabla th {
            text-align: left;
            padding: 10px 8px;
            background: #f1f5f9;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        table.pcp-tabla th:hover { background: #e2e8f0; }

        table.pcp-tabla td {
            padding: 8px;
            border-bottom: 1px solid var(--color-borde);
            white-space: nowrap;
        }

        table.pcp-tabla tbody tr:hover { background: #f8fafc; }

        .pcp-tabla-scroll {
            max-height: 65vh;
            overflow: auto;
            border: 1px solid var(--color-borde);
            border-radius: 10px;
        }

        .badge-tipo-quiz { background: #4f46e5; }
        .badge-tipo-pareo { background: #0ea5e9; }
        .badge-tipo-fotos { background: #16a34a; }

        .nota-baja { color: #dc2626; font-weight: 700; }
        .nota-alta { color: #16a34a; font-weight: 700; }

        #pcp-vacio, #pcp-cargando, #pcp-error { text-align: center; padding: 30px; color: #64748b; }
        #pcp-error { color: #dc2626; }

        .pcp-resumen {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .pcp-resumen-item {
            background: #f8fafc;
            border: 1px solid var(--color-borde);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .pcp-resumen-item b { display: block; font-size: 17px; }
    </style>
</head>

<body class="tema-docente">

    <header class="pcp-header">
        <div>
            <h1>🧪 Prácticas de Ciencias Naturales</h1>
            <p>Último intento de cada estudiante · Clases 1 a 4 · Todos los salones</p>
        </div>
        <div id="navCambiarPanel"></div>
    </header>

    <div class="pcp-contenedor">

        <div class="pcp-panel">
            <div style="margin-bottom:14px;">
                <p style="margin:0 0 6px; font-weight:700; font-size:13px;">Clase</p>
                <div class="chips-selector" id="pcp-filtro-clase"></div>
            </div>

            <div style="margin-bottom:14px;">
                <p style="margin:0 0 6px; font-weight:700; font-size:13px;">Tipo de ejercicio</p>
                <div class="chips-selector" id="pcp-filtro-tipo"></div>
            </div>

            <div>
                <p style="margin:0 0 6px; font-weight:700; font-size:13px;">Salón</p>
                <div class="chips-selector" id="pcp-filtro-salon"></div>
            </div>
        </div>

        <div id="pcp-cargando">Cargando resultados…</div>
        <div id="pcp-error" hidden></div>
        <div id="pcp-vacio" hidden>No hay intentos de práctica registrados con estos filtros.</div>

        <div id="pcp-resultados" hidden>
            <div class="pcp-resumen" id="pcp-resumen"></div>

            <div class="pcp-tabla-scroll">
                <table class="pcp-tabla">
                    <thead>
                        <tr>
                            <th data-orden="nombre">Estudiante</th>
                            <th data-orden="salon">Salón</th>
                            <th data-orden="clase">Clase</th>
                            <th data-orden="tipo">Ejercicio</th>
                            <th data-orden="nota_meduca">Nota</th>
                            <th data-orden="porcentaje">%</th>
                            <th data-orden="correctas">Correctas</th>
                            <th data-orden="incorrectas">Incorrectas</th>
                            <th data-orden="finalizado_at">Último intento</th>
                        </tr>
                    </thead>
                    <tbody id="pcp-tbody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/practica_ciencias_profesor.js"></script>
</body>
</html>
