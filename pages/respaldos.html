<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de respaldo | C.E.B.G. El Jiral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/login-favicon.ico">
    <style>
body { font-family: 'Inter', Arial, sans-serif; padding: 24px 16px 60px; background: var(--color-fondo); }
        h1, h2 { font-family: 'Baloo 2', 'Inter', Arial, sans-serif; }

        .encabezado-pagina { max-width: 1200px; margin: 0 auto 20px; }
        .encabezado-pagina h1 { color: var(--color-primario); font-size: 1.7rem; font-weight: 700; margin-bottom: 4px; }
        .encabezado-pagina .enlaces-nav a { color: var(--color-primario); text-decoration: none; font-weight: 600; font-size: .9rem; }
        .encabezado-pagina .enlaces-nav a:hover { text-decoration: underline; }

        .contenedor { max-width: 1200px; margin: 0 auto; }

        .panel-blanco {
            background: white; padding: 20px 22px; border-radius: 14px;
            margin-bottom: 20px; box-shadow: 0 4px 14px rgba(20, 40, 70, .08);
        }
        .panel-blanco h2 { font-size: 1.1rem; color: var(--color-primario); margin-bottom: 4px; }
        .panel-blanco .subtexto { font-size: .85rem; color: #6c757d; margin-bottom: 16px; }

        .btn-primario-jiral { background: var(--color-primario); border-color: var(--color-primario); font-weight: 600; }
        .btn-primario-jiral:hover { background: #17395c; border-color: #17395c; }

        .fila-controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        .fila-controles select, .fila-controles input { max-width: 280px; }

        .badge-insert { background: #d1f7e0; color: #0f7a3d; }
        .badge-update { background: #fff3cd; color: #8a6708; }
        .badge-delete { background: #fde2e2; color: #a41818; }

        #tablaRespaldoWrap { overflow-x: auto; }
        #tablaRespaldo { font-size: .82rem; }
        #tablaRespaldo th { background: var(--color-primario-claro); color: var(--color-primario); white-space: nowrap; position: sticky; top: 0; }
        #tablaRespaldo td { white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

        .estado-carga { padding: 30px; text-align: center; color: #6c757d; }
    </style>
    <link rel="stylesheet" href="../css/temas.css">
</head>

<body class="tema-institucional">

    <div class="encabezado-pagina">
        <h1><i class="fa-solid fa-clock-rotate-left me-2"></i>Historial de respaldo</h1>
        <div class="enlaces-nav">
            <a href="admin.html">&larr; Volver al panel de administración</a>
        </div>
    </div>

    <div class="contenedor">

        <div class="panel-blanco">
            <h2><i class="fa-solid fa-database me-1"></i>Ver copia de respaldo</h2>
            <p class="subtexto">
                Cada tabla del sistema tiene una copia automática que registra todo lo que se agrega,
                edita o elimina. Elige una tabla para ver su historial más reciente.
            </p>

            <div class="fila-controles">
                <select id="selectTabla" class="form-select form-select-sm">
                    <option value="">Selecciona una tabla…</option>
                </select>

                <input type="text" id="inputBuscar" class="form-control form-control-sm" placeholder="Buscar en los resultados...">

                <select id="selectOperacion" class="form-select form-select-sm" style="max-width:160px;">
                    <option value="">Todas las operaciones</option>
                    <option value="INSERT">Solo agregados</option>
                    <option value="UPDATE">Solo editados</option>
                    <option value="DELETE">Solo eliminados</option>
                </select>

                <button id="btnActualizar" type="button" class="btn btn-primario-jiral text-white btn-sm">
                    <i class="fa-solid fa-rotate me-1"></i>Actualizar
                </button>

                <span id="contadorFilas" class="small text-muted ms-auto"></span>
            </div>

            <div id="estadoRespaldo" class="estado-carga">
                Elige una tabla arriba para ver su historial.
            </div>

            <div id="tablaRespaldoWrap" class="d-none" style="max-height: 65vh;">
                <table id="tablaRespaldo" class="table table-striped table-sm table-bordered mb-0">
                    <thead><tr id="filaEncabezados"></tr></thead>
                    <tbody id="cuerpoRespaldo"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module" src="../js/respaldos.js"></script>

</body>

</html>
