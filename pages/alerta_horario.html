<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horario · Centro Básico General El Jiral</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, var(--morado-oscuro), var(--azul-medio));
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px 12px;
    }
    .tarjeta-principal {
        max-width: 700px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .encabezado-horario {
        background: linear-gradient(90deg, var(--azul-claro), var(--morado));
        color: #fff;
        padding: 18px 24px;
        text-align: center;
    }
    .encabezado-horario h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .encabezado-horario p { margin: 4px 0 0; font-size: .82rem; opacity: .9; }
    .barra-acciones { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #eee; }
    .zona-activar { padding: 16px 24px; text-align: center; border-bottom: 1px solid #eee; }
    .zona-activar.oculta { display: none; }
    #btnActivarAlertas { font-size: 1rem; padding: 10px 22px; }
    .aviso-activo { display: none; padding: 10px 24px; background: #e6f7ec; color: #1e7e34; text-align: center; font-size: .85rem; font-weight: 600; }
    .aviso-activo.mostrar { display: block; }
    .lista-clases { padding: 16px 24px; }
    .tarjeta-clase {
        border: 1px solid #eee; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .tarjeta-clase.en-curso { border-color: var(--verde-ok); background: #f4fbf6; }
    .tarjeta-clase.terminada { opacity: .5; }
    .tarjeta-clase .info h3 { font-size: .98rem; margin: 0; color: var(--indigo); }
    .tarjeta-clase .info .meta { font-size: .8rem; color: #666; }
    .tarjeta-clase .cuenta { font-size: .82rem; font-weight: 700; color: var(--azul-claro); white-space: nowrap; }
    .tarjeta-clase.en-curso .cuenta { color: var(--verde-ok); }
    .tarjeta-clase.terminada .cuenta { color: #999; }
    #bannerAlerta {
        display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        background: #dc3545; color: #fff; padding: 14px 24px; border-radius: 12px;
        font-weight: 700; font-size: 1rem; z-index: 2000; box-shadow: 0 8px 24px rgba(0,0,0,.3);
        max-width: 90vw; text-align: center;
    }
    #bannerAlerta.mostrar { display: block; animation: parpadeo 1s infinite; }
    @keyframes parpadeo { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
    #estadoHorario { text-align: center; padding: 6px 24px 16px; font-size: .85rem; min-height: 20px; }
</style>
    <link rel="stylesheet" href="../css/temas.css">
</head>
<body class="tema-planificacion">

<div id="bannerAlerta"></div>

<div class="tarjeta-principal">
    <div class="encabezado-horario">
        <h1>🔔 HORARIO</h1>
        <p id="subtituloHorario">Cargando...</p>
    </div>

    <div class="barra-acciones">
        <a href="profesor.html" class="btn btn-outline-secondary btn-sm" id="enlaceVolverProfesor" style="display:none;">↩️ Volver a Docente</a>
        <a href="estudiante.html" class="btn btn-outline-secondary btn-sm" id="enlaceVolverEstudiante" style="display:none;">↩️ Volver</a>
    </div>

    <div class="zona-activar" id="zonaActivar">
        <p style="font-size:.85rem; color:#555; margin-bottom:10px;">
            Toca el botón para activar el sonido y las notificaciones. El navegador
            necesita este toque para poder sonar más adelante.
        </p>
        <button type="button" class="btn btn-danger" id="btnActivarAlertas">🔔 Activar alertas</button>
    </div>

    <div class="aviso-activo" id="avisoActivo">✅ Alertas activas — mantén esta página abierta</div>

    <div style="padding: 12px 24px; text-align: center; border-bottom: 1px solid #eee;">
        <button type="button" class="btn btn-outline-primary btn-sm" id="btnEscucharProxima">🔊 Escuchar próxima clase</button>
    </div>

    <div class="lista-clases" id="listaClases">
        <p class="text-center text-muted py-4">Cargando horario...</p>
    </div>

    <div id="estadoHorario"></div>
</div>

<script type="module" src="../js/alerta_horario.js"></script>
</body>
</html>
