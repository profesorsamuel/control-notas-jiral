<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salones | C.E.B.G. El Jiral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo: #f3f1fb;
            --panel: #ffffff;
            --texto: #2c2740;
            --borde: #e7e3f7;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            padding: 24px;
        }

        h1, h2, .titulo-nivel { font-family: 'Baloo 2', 'Inter', Arial, sans-serif; }

        .encabezado {
            background: linear-gradient(135deg, #6a4fb3 0%, #8f4f9e 100%);
            color: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 6px 18px rgba(106, 79, 179, .25);
        }

        .encabezado h1 { font-size: 1.6rem; font-weight: 700; margin: 0; }
        .encabezado p { margin: 6px 0 0; opacity: .9; }
        .encabezado a { color: #fff; text-decoration: none; }
        .encabezado a:hover { text-decoration: underline; }

        .panel {
            background: var(--panel);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 22px;
            box-shadow: 0 2px 10px rgba(60, 40, 110, .07);
            border: 1px solid var(--borde);
        }

        .nivel-bloque { margin-bottom: 28px; }
        .nivel-bloque:last-child { margin-bottom: 0; }

        .titulo-nivel {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titulo-nivel .pastilla-cantidad {
            font-family: 'Inter', Arial, sans-serif;
            font-size: .72rem;
            font-weight: 600;
            background: var(--fondo);
            color: #6a4fb3;
            border-radius: 20px;
            padding: 2px 10px;
        }

        .grid-salones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .tarjeta-salon {
            border-radius: 14px;
            padding: 16px 14px;
            color: #fff;
            position: relative;
            min-height: 92px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .12s ease;
            cursor: default;
        }

        .tarjeta-salon:hover { transform: translateY(-2px); }

        .tarjeta-salon.inactivo {
            opacity: .45;
            filter: grayscale(.4);
        }

        .tarjeta-salon .nombre-salon {
            font-family: 'Baloo 2', 'Inter', Arial, sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .tarjeta-salon .acciones-salon {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .tarjeta-salon .acciones-salon button {
            border: none;
            background: rgba(255,255,255,.22);
            color: #fff;
            border-radius: 8px;
            font-size: .75rem;
            padding: 4px 8px;
            cursor: pointer;
        }

        .tarjeta-salon .acciones-salon button:hover { background: rgba(255,255,255,.4); }

        .tarjeta-salon .badge-inactivo {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: .65rem;
            background: rgba(0,0,0,.35);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .tarjeta-agregar {
            border: 2px dashed #c9c1ea;
            border-radius: 14px;
            min-height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8f80c9;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            background: #fbfaff;
            transition: background .12s ease, border-color .12s ease;
        }

        .tarjeta-agregar:hover { background: #f2eefd; border-color: #6a4fb3; color: #6a4fb3; }

        #formSalon .form-control, #formSalon .form-select { border-radius: 8px; }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--borde);
            cursor: pointer;
            display: inline-block;
        }

        .swatch.seleccionado { box-shadow: 0 0 0 2px #6a4fb3; }

        #mensajeSalones { display: none; }
    </style>
</head>

<body>

    <div class="encabezado">
        <h1>🏫 Salones del colegio</h1>
        <p>
            <a href="admin.html">&larr; Volver al panel de administración</a>
            &nbsp;·&nbsp;
            <a href="asignaciones.html">Ir a Asignaciones</a>
            &nbsp;·&nbsp;
            <a href="profesores.html">Ver directorio de profesores</a>
        </p>
    </div>

    <div id="mensajeSalones" class="alert" role="alert"></div>

    <!-- FORMULARIO PARA AGREGAR / EDITAR UN SALÓN -->
    <div class="panel" id="panelFormSalon" style="display:none;">
        <h2 class="h6 mb-3" id="tituloFormSalon">Nuevo salón</h2>
        <form id="formSalon">
            <input type="hidden" id="salonIdEdicion">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-2">
                    <label class="form-label small fw-bold">Nivel</label>
                    <select id="inputNivelSalon" class="form-select" required>
                        <option value="7">7°</option>
                        <option value="8">8°</option>
                        <option value="9">9°</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label small fw-bold">Letra</label>
                    <input type="text" id="inputLetraSalon" class="form-control text-uppercase" maxlength="2" placeholder="A" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label small fw-bold d-block">Color</label>
                    <div id="paletaColores" class="d-flex gap-2 flex-wrap"></div>
                </div>
                <div class="col-6 col-md-2">
                    <button type="submit" class="btn btn-primary w-100" id="btnGuardarSalon">Guardar</button>
                </div>
                <div class="col-6 col-md-2">
                    <button type="button" class="btn btn-outline-secondary w-100" id="btnCancelarSalon">Cancelar</button>
                </div>
            </div>
        </form>
    </div>

    <!-- LISTADO POR NIVEL -->
    <div class="panel">
        <div id="contenedorNiveles">Cargando salones...</div>
    </div>

    <script type="module" src="../js/salones.js"></script>

</body>

</html>
