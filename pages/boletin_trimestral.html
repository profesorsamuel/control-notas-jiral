<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boletín de los 3 Trimestres - C.E.B.G. El Jiral</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: var(--fondo);
            padding: 20px;
        }

        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 22px;
        }

        .encabezado h1 {
            color: var(--azul-oscuro);
            margin: 10px 0 4px;
            font-size: 1.7rem;
        }

        .encabezado p {
            color: var(--texto-suave);
            margin: 0;
        }

        .tarjeta-busqueda {
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            margin-bottom: 22px;
        }

        .fila-busqueda {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fila-busqueda .campo-cedula {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .fila-busqueda input[type="text"],
        .fila-busqueda input[type="password"] {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-ojo {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--texto-suave);
        }

        button.btn-buscar {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: var(--azul);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-buscar:hover { background: #1d4ed8; }
        button.btn-buscar:disabled { background: var(--texto-mas-suave); cursor: not-allowed; }

        .mensaje {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error { display: block; background: #fee2e2; color: #991b1b; }
        .info { display: block; background: #dbeafe; color: #1e40af; }

        #resultado { display: none; }

        .resumen-estudiante {
            background: #ffffff;
            border-radius: 14px;
            padding: 18px 22px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .resumen-estudiante h2 {
            margin: 0 0 3px;
            color: #1f4e79;
            font-size: 1.25rem;
        }

        .resumen-estudiante p { margin: 0; color: var(--texto-suave); }
        .resumen-estudiante .fecha-generacion { font-size: 0.78rem; color: var(--texto-mas-suave, #94a3b8); }

        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .acciones button {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        #btnPdf { background: #198754; }
        #btnPdf:hover { background: #146c43; }
        #btnImprimir { background: #1f4e79; }
        #btnImprimir:hover { background: #17395a; }

        .tarjeta-tabla {
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            margin-bottom: 18px;
            overflow-x: auto;
        }

        table.tabla-boletin {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: .92rem;
        }

        table.tabla-boletin th,
        table.tabla-boletin td {
            border: 1px solid var(--borde);
            padding: 10px 8px;
        }

        table.tabla-boletin thead {
            background: #1e293b;
            color: #fff;
        }

        table.tabla-boletin thead th:first-child { text-align: left; }

        .celda-materia {
            text-align: left;
            font-weight: 600;
            color: #1e293b;
        }

        .celda-nota { font-weight: 600; }

        .celda-final {
            font-weight: 800;
            font-size: 1rem;
        }

        .resaltado-rojo {
            background: #fee2e2;
            color: #b91c1c !important;
        }

        .resaltado-verde {
            background: #dcfce7;
            color: #166534 !important;
        }

        tr.fila-fracaso td.celda-materia { color: #b91c1c; }

        .etiqueta-fracaso {
            display: inline-block;
            background: #dc2626;
            color: #fff;
            font-size: 0.68rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 999px;
            vertical-align: middle;
        }

        .bloque-promedio-general {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bloque-promedio-general h3 {
            margin: 0;
            color: #1f4e79;
            font-size: 1.05rem;
        }

        .valor-promedio-general {
            font-size: 1.6rem;
            font-weight: 800;
            color: #15803d;
        }

        .valor-promedio-general.fracaso { color: #dc2626; }

        #avisoFracaso {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            color: #991b1b;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .leyenda-colores {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: var(--texto-suave);
            margin-bottom: 18px;
        }

        .leyenda-colores span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .punto {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        .punto.rojo { background: #fee2e2; border: 1px solid #fca5a5; }
        .punto.verde { background: #dcfce7; border: 1px solid #86efac; }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--azul);
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .fila-busqueda { flex-direction: column; }
            button.btn-buscar { width: 100%; }
            .resumen-estudiante { flex-direction: column; align-items: flex-start; }
        }

        @media print {
            .tarjeta-busqueda, .acciones, .volver, .leyenda-colores { display: none !important; }
            body { background: #fff; padding: 0; }
            .contenedor { max-width: 100%; }
            .tarjeta-tabla, .resumen-estudiante, .bloque-promedio-general, #avisoFracaso {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/temas.css">
</head>

<body class="tema-datos">

    <div class="contenedor">

        <div class="encabezado">
            <h1>🎓 C.E.B.G. EL JIRAL</h1>
            <p>Boletín de los 3 Trimestres y Promedio Final</p>
        </div>

        <div class="tarjeta-busqueda">
            <label for="cedula" style="display:block; font-weight:bold; margin-bottom:8px; color:#334155;">
                Escribe la cédula del estudiante
            </label>
            <div class="fila-busqueda">
                <div class="campo-cedula">
                    <input type="password" id="cedula" placeholder="0-000-0000" autocomplete="off">
                    <button type="button" class="btn-ojo" id="btnOjo" title="Mostrar/ocultar cédula">👁️</button>
                </div>
                <button type="button" class="btn-buscar" id="btnBuscar">Ver boletín</button>
            </div>
            <div id="mensaje" class="mensaje" role="alert"></div>
        </div>

        <div id="resultado">

            <div class="resumen-estudiante">
                <div>
                    <h2 id="nombreEstudiante">-</h2>
                    <p id="salonEstudiante"></p>
                    <p class="fecha-generacion">Generado el: <span id="fechaGeneracion">-</span></p>
                </div>
                <div class="acciones">
                    <button type="button" id="btnImprimir">🖨️ Imprimir</button>
                    <button type="button" id="btnPdf">📄 Descargar PDF</button>
                </div>
            </div>

            <div id="avisoFracaso"></div>

            <div class="bloque-promedio-general" id="bloquePromedioGeneral">
                <h3>Promedio General (3 trimestres)</h3>
                <span class="valor-promedio-general" id="promedioGeneral">-</span>
            </div>

            <div class="leyenda-colores">
                <span><span class="punto rojo"></span> Nota por debajo de 3.0 (en riesgo)</span>
                <span><span class="punto verde"></span> Promedio final aprobado</span>
            </div>

            <div class="tarjeta-tabla">
                <table class="tabla-boletin">
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Trimestre 1</th>
                            <th>Trimestre 2</th>
                            <th>Trimestre 3</th>
                            <th>Promedio Final</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>

        </div>

        <a href="inicio.html" class="volver">← Volver al inicio</a>

    </div>

    <!-- Librería jsPDF (para el botón de descarga) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script type="module" src="../js/boletin_trimestral.js"></script>

</body>
</html>
