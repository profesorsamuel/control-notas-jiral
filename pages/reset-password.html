<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña - Control de Notas</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../img/reset-password-favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/reset-password-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/reset-password-favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/reset-password-apple-touch-icon.png">

    <!-- Vista previa al compartir el enlace -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Restablecer contraseña | Control de Notas - C.E.B.G. El Jiral">
    <meta property="og:description" content="Restablece la contraseña de tu cuenta en el sistema de Control de Notas.">
    <meta property="og:image" content="https://notasjiral.netlify.app/img/reset-password-og-image.jpg">
    <meta property="og:url" content="https://notasjiral.netlify.app/pages/reset-password.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://notasjiral.netlify.app/img/reset-password-og-image.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
        }

        .tarjeta {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 25px;
        }

        .encabezado h1 {
            margin: 0;
            color: #1e3a8a;
            font-size: 22px;
        }

        .encabezado p {
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
        }

        .grupo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .mensaje {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }

        .exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="encabezado">
                <h1>🔑 Restablecer contraseña</h1>
                <p id="descripcion">Escribe tu nueva contraseña para tu cuenta.</p>
            </div>

            <form id="resetForm">

                <div class="grupo">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" minlength="6" required autocomplete="new-password">
                </div>

                <div class="grupo">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" id="btnGuardar">
                    💾 Guardar nueva contraseña
                </button>

                <div id="mensaje" class="mensaje" role="alert"></div>

            </form>

            <a href="login.html" class="volver">← Volver al inicio de sesión</a>

        </div>

    </div>

    <script type="module" src="../js/reset-password.js"></script>

</body>

</html>
