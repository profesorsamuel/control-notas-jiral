<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis tareas · Centro Básico General El Jiral</title>

<link rel="icon" type="image/x-icon" href="../img/estudiante-favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #4b3fb3, #2f7bd1);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px 12px;
    }
    .tarjeta-principal {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .encabezado-tareas {
        background: linear-gradient(90deg, #3a6fd8, #5a4fcf);
        color: #fff;
        padding: 18px 24px;
        text-align: center;
    }
    .encabezado-tareas h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .barra-acciones { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #eee; }
    .lista-tareas { padding: 16px 24px; }
    .tarjeta-tarea {
        border: 1px solid #eee; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
        display: flex; flex-direction: column; gap: 6px;
    }
    .tarjeta-tarea.terminada { border-color: #bfe6c9; background: #f4fbf6; }
    .tarjeta-tarea.vencida { border-color: #f3b9b9; background: #fef6f6; }
    .tarjeta-tarea h3 { font-size: 1.02rem; margin: 0; color: #2f3ea3; }
    .tarjeta-tarea .meta { font-size: .82rem; color: #666; }
    .fila-estado { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .fila-estado select {
        padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: .85rem;
    }
    .etiqueta-vencida {
        display: inline-block; background: #dc2626; color: #fff; font-size: .68rem; font-weight: bold;
        padding: 2px 8px; border-radius: 999px;
    }
    .etiqueta-mia {
        display: inline-block; background: #ede9fe; color: #5b21b6; font-size: .65rem; font-weight: bold;
        padding: 2px 8px; border-radius: 999px; vertical-align: middle;
    }
    #estadoTareas { text-align: center; padding: 6px 24px 16px; font-size: .85rem; min-height: 20px; }

    /* ===== Aviso de tareas pendientes por fecha ===== */
    .aviso-pendientes {
        margin: 0 24px 14px; padding: 12px 16px; border-radius: 10px; font-size: .88rem;
        display: none; gap: 4px; flex-direction: column;
    }
    .aviso-pendientes.mostrar { display: flex; }
    .aviso-pendientes.nivel-vencida { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .aviso-pendientes.nivel-proxima { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; }
    .aviso-pendientes strong { font-size: .95rem; }

    /* ===== Formulario para agregar tarea (estudiante autorizado) ===== */
    .zona-form { padding: 20px 24px; border-bottom: 1px solid #eee; display: none; }
    .zona-form.mostrar { display: block; }
    .zona-form label { font-size: .85rem; font-weight: 600; margin-top: 10px; display: block; }
    .zona-form input, .zona-form select, .zona-form textarea {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 4px;
    }
    .acciones-form { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<div class="tarjeta-principal">
    <div class="encabezado-tareas">
        <h1>📝 Mis tareas</h1>
    </div>

    <div class="barra-acciones">
        <a href="estudiante.html" class="btn btn-outline-secondary btn-sm">↩️ Regresar a mis notas</a>
        <button class="btn btn-primary btn-sm" id="btnMostrarFormEstudiante" style="display:none;">➕ Agregar tarea</button>
    </div>

    <div class="aviso-pendientes" id="avisoPendientes"></div>

    <div class="zona-form" id="zonaFormEstudiante">
        <label>Título</label>
        <input type="text" id="inputTituloEst" placeholder="Ej: Investigación de ecosistemas">

        <label>Materia</label>
        <select id="inputMateriaEst">
            <option value="">Cargando materias...</option>
        </select>

        <label>Descripción (opcional)</label>
        <textarea id="inputDescripcionEst" rows="3" placeholder="Detalles de la tarea"></textarea>

        <label>Fecha de entrega</label>
        <input type="date" id="inputFechaEst">

        <label>Hora de entrega (opcional)</label>
        <input type="time" id="inputHoraEst">

        <div class="acciones-form">
            <button class="btn btn-sm btn-outline-secondary" id="btnCancelarFormEst">Cancelar</button>
            <button class="btn btn-sm btn-primary" id="btnGuardarTareaEst">Guardar tarea</button>
        </div>
    </div>

    <div class="lista-tareas" id="listaTareas">
        <p class="text-center text-muted py-4">Cargando tareas...</p>
    </div>

    <div id="estadoTareas"></div>
</div>

<script type="module" src="../js/mis_tareas.js"></script>
</body>
</html>
