<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación semanal · Centro Básico General El Jiral</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    body {
        background: linear-gradient(135deg, #4b3fb3, #2f7bd1);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px 12px;
    }
    .tarjeta-principal {
        max-width: 760px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .encabezado-planificacion {
        background: linear-gradient(90deg, #3a6fd8, #5a4fcf);
        color: #fff;
        padding: 18px 24px;
        text-align: center;
    }
    .encabezado-planificacion h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
    .encabezado-planificacion p { margin: 4px 0 0; font-size: .82rem; opacity: .9; }
    .barra-acciones { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #eee; }

    .cuerpo-form { padding: 22px 24px; }
    .cuerpo-form label { font-size: .85rem; font-weight: 600; margin-top: 14px; display: block; }
    .cuerpo-form select, .cuerpo-form input[type="number"] {
        width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 4px;
    }
    .texto-ayuda { font-size: .78rem; color: #777; margin-top: 4px; }

    .fila-selectores { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .fila-selectores { grid-template-columns: 1fr; } }

    .acciones-form { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    #estadoSemana {
        text-align: center; padding: 6px 24px 18px; font-size: .85rem; min-height: 20px;
    }

    .lista-lecciones { padding: 0 24px 22px; }
    .grupo-area { margin-bottom: 14px; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
    .grupo-area .titulo-area { background: #f4f5fb; padding: 8px 12px; font-weight: 700; font-size: .82rem; color: #3a3a6a; }
    .fila-leccion {
        display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; font-size: .85rem;
        border-top: 1px solid #f2f2f2;
    }
    .fila-leccion input[type="checkbox"] { margin-top: 3px; }
    .fila-leccion .detalle-leccion { flex: 1; }
    .fila-leccion .detalle-leccion small { color: #888; display: block; }

    .acciones-guardar { padding: 0 24px 24px; text-align: center; }
</style>
</head>
<body>

<div class="tarjeta-principal">
    <div class="encabezado-planificacion">
        <h1>🗓️ Planificación semanal</h1>
        <p>Elige la semana y marca qué lecciones vas a cubrir</p>
    </div>

    <div class="barra-acciones">
        <a href="profesor.html" class="btn btn-outline-secondary btn-sm">↩️ Regresar a Docente</a>
        <a href="planificacion_subir.html" class="btn btn-outline-primary btn-sm">📖 Subir libro / programa</a>
    </div>

    <div class="cuerpo-form">
        <div class="fila-selectores">
            <div>
                <label for="selectMateriaSemana">Materia</label>
                <select id="selectMateriaSemana">
                    <option value="">Cargando materias...</option>
                </select>
            </div>
            <div>
                <label for="selectGradoSemana">Grado</label>
                <select id="selectGradoSemana">
                    <option value="">Selecciona un grado</option>
                    <option value="7">7°</option>
                    <option value="8">8°</option>
                    <option value="9">9°</option>
                </select>
            </div>
        </div>

        <div class="fila-selectores" style="margin-top:14px;">
            <div>
                <label for="selectTrimestreSemana">Trimestre</label>
                <select id="selectTrimestreSemana">
                    <option value="">Selecciona</option>
                    <option value="1">Trimestre 1</option>
                    <option value="2">Trimestre 2</option>
                    <option value="3">Trimestre 3</option>
                </select>
            </div>
            <div>
                <label for="inputSemanaNumero">N.º de semana</label>
                <input type="number" id="inputSemanaNumero" min="1" max="16" placeholder="Ej. 3">
            </div>
        </div>

        <div class="acciones-form">
            <button class="btn btn-sm btn-primary" id="btnCargarLecciones" disabled>Cargar lecciones</button>
        </div>
    </div>

    <div id="estadoSemana"></div>
    <div id="listaLecciones" class="lista-lecciones"></div>

    <div id="cajaGuardar" class="acciones-guardar d-none">
        <button class="btn btn-success" id="btnGuardarSemana">✅ Guardar selección de la semana</button>
    </div>
</div>

<script type="module" src="../js/planificacion_semana.js"></script>
</body>
</html>
