<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar Cuaderno de Tareas 9°C | C.E.B.G. El Jiral</title><link rel="icon" href="../img/profesor-favicon.ico"><link rel="stylesheet" href="../css/vida_estudiantil.css"><link rel="stylesheet" href="../css/cuaderno_tareas_9c.css"></head><body>
<header class="ve-top"><div class="ve-wrap ve-top-row"><div class="ve-brand"><img src="../img/escudo-jiral.png" alt="Escudo del C.E.B.G. El Jiral"><div><h1>Cuaderno de Tareas · Administrar</h1><p>C.E.B.G. El Jiral · Salón 9°C</p></div></div><nav class="ve-nav"><a href="profesor.html">← Panel de profesor</a><a href="#" id="btnSalirCuadAdmin">Salir</a></nav></div></header>
<main class="ve-wrap ve-main">
<div id="mensajeCuadAdmin" class="ve-alert" role="alert"></div>

<section class="ve-panel" style="padding:18px;margin-bottom:18px;">
  <h2 style="margin-top:0;color:var(--azul)">Nueva tarea</h2>
  <div class="ve-verif-grid" style="grid-template-columns:1fr 1fr;">
    <div class="ve-campo"><label for="fMateria"><strong>Materia</strong></label><select id="fMateria" class="ve-select"><option value="">Cargando…</option></select></div>
    <div class="ve-campo"><label for="fFecha"><strong>Fecha de entrega (opcional)</strong></label><input type="date" id="fFecha" class="ve-input"></div>
  </div>
  <div class="ve-campo"><label for="fTitulo"><strong>Título de la tarea</strong></label><input type="text" id="fTitulo" class="ve-input" placeholder="Ej: Ejercicio en casa 1"></div>
  <div class="ve-campo"><label for="fDescripcion"><strong>Descripción (opcional)</strong></label><textarea id="fDescripcion" class="ve-textarea" placeholder="Instrucciones para el estudiante"></textarea></div>
  <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-weight:700;color:var(--azul)"><input type="checkbox" id="fRequiereFoto" style="width:18px;height:18px;"> Pide que el estudiante suba foto de evidencia</label>
  <div class="ve-verif-acciones">
    <button class="ve-btn primary" id="btnGuardarTarea">➕ Agregar tarea</button>
    <button class="ve-btn light" id="btnCancelarEdicion" hidden>Cancelar edición</button>
  </div>
</section>

<section id="listaAdminMaterias"></section>
</main>
<script type="module" src="../js/cuaderno_tareas_9c_admin.js"></script></body></html>
