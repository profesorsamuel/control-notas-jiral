const C=[
{n:1,date:'14 al 25 de septiembre',title:'Transformaciones y reacciones químicas',pdf:'materiales-08/clase1/clase1-ciencias-8.pdf',imgs:['01-introduccion.png','02-infografia-general.png','03-transformaciones-quimicas.png','04-energia-en-las-reacciones.png','05-reversibles-e-irreversibles.png','06-ecuacion-quimica.png','07-combustion.png','08-fermentacion-y-oxidacion.png','09-numero-de-oxidacion.png','10-esquema-final-con-llaves.png'],sections:[
 ['¿Qué es una transformación química?','Una transformación o reacción química ocurre cuando una o más sustancias llamadas reactivos se convierten en sustancias nuevas llamadas productos. Durante el proceso se rompen enlaces, se forman otros y los átomos se reorganizan. La materia no desaparece: se conserva.'],
 ['Señales y energía','Una reacción puede producir cambios de color, olor, temperatura, luz o gases. Las reacciones endotérmicas absorben energía del entorno; las exotérmicas la liberan, generalmente como calor o luz.'],
 ['Reversibles e irreversibles','En una reacción reversible, los productos pueden volver a convertirse en reactivos. En una irreversible no se recuperan los reactivos originales con facilidad. La oxidación del hierro y la combustión de una vela son ejemplos irreversibles.'],
 ['Ecuaciones químicas','Una ecuación representa reactivos → productos. Los coeficientes indican cantidades de moléculas y se ajustan para conservar el número de átomos. Los subíndices forman parte de la fórmula y no deben cambiarse al balancear.'],
 ['Procesos cotidianos','Combustión: combustible + comburente producen energía. Fermentación: microorganismos como la levadura transforman azúcares. Oxidación: una sustancia pierde electrones; la corrosión es una manifestación común. El número de oxidación ayuda a seguir la transferencia de electrones.']
],mc:[['En una reacción química, las sustancias iniciales se llaman…',['Productos','Reactivos','Coeficientes'],1],['Una reacción que libera calor es…',['Endotérmica','Reversible','Exotérmica'],2],['¿Qué se conserva durante una reacción?',['La materia y los átomos','El color','La temperatura'],0],['Al balancear una ecuación se modifican…',['Los subíndices','Los coeficientes','Los símbolos químicos'],1],['La herrumbre es un ejemplo de…',['Oxidación','Fermentación','Fusión'],0]],match:[['Reactivo','Sustancia presente antes de la reacción'],['Producto','Sustancia nueva formada'],['Endotérmica','Absorbe energía'],['Exotérmica','Libera energía'],['Combustión','Reacción con combustible y comburente']],vocab:['Transformación química','Reactivo','Producto','Enlace químico','Conservación de la materia','Reacción endotérmica','Reacción exotérmica','Reacción reversible','Reacción irreversible','Ecuación química','Coeficiente','Subíndice','Balanceo','Estado de agregación','Combustión','Combustible','Comburente','Fermentación','Levadura','Oxidación','Corrosión','Número de oxidación','Electrón','Antioxidante'],practice:'Demostración segura: compare papel rasgado (cambio físico) con una tableta efervescente en agua (cambio químico). Registre evidencias, identifique reactivos y productos y explique qué indica la formación de gas.'},
{n:2,date:'28 de septiembre al 8 de octubre',title:'Leyes de Kepler y movimientos de la Tierra',pdf:'materiales-08/clase2/clase2-ciencias-8.pdf',imgs:['01-introduccion.png','02-infografia-general.png','03-tres-leyes-de-kepler.png','04-primera-ley-orbitas.png','05-segunda-ley-areas.png','06-tercera-ley-periodos.png','07-rotacion-y-traslacion.png','08-estaciones-del-ano.png','09-perihelio-y-afelio.png','10-precesion-y-nutacion.png','11-forma-real-de-la-tierra.png','12-esquema-final.png'],sections:[
 ['Primera ley: órbitas','Los planetas se mueven en órbitas elípticas y el Sol ocupa uno de los focos. Por eso la distancia entre cada planeta y el Sol cambia durante su recorrido.'],
 ['Segunda ley: áreas','La línea imaginaria que une un planeta con el Sol barre áreas iguales en tiempos iguales. El planeta se mueve más rápido cerca del Sol y más lento cuando está lejos.'],
 ['Tercera ley: periodos','El cuadrado del periodo orbital es proporcional al cubo del radio orbital: T² ∝ a³. Cuanto más lejos está un planeta, más tarda en completar su órbita. Mercurio tarda 88 días y Neptuno cerca de 165 años.'],
 ['Rotación y traslación','La rotación dura aproximadamente 24 horas y origina el día y la noche. La traslación dura 365 días, 5 horas y 57 minutos; las horas acumuladas explican el año bisiesto.'],
 ['Estaciones y otros movimientos','La inclinación terrestre de 23,5°, junto con la traslación, causa las estaciones. Perihelio y afelio son los puntos más cercano y lejano al Sol. La precesión es el cambio lento de orientación del eje y la nutación es una pequeña oscilación superpuesta. La Tierra es un esferoide, achatado en los polos y ensanchado en el ecuador.']
],mc:[['Según Kepler, las órbitas planetarias son…',['Cuadradas','Elípticas','Rectas'],1],['El planeta se mueve más rápido cuando está…',['Más cerca del Sol','Más lejos del Sol','En el centro'],0],['La rotación produce…',['Las estaciones','El día y la noche','El año bisiesto'],1],['La causa principal de las estaciones es…',['La inclinación del eje','El tamaño del Sol','La Luna'],0],['La forma real de la Tierra es…',['Cubo','Esferoide','Disco plano'],1]],match:[['Elipse','Curva cerrada con dos focos'],['Periodo orbital','Tiempo de una vuelta alrededor del Sol'],['Rotación','Giro sobre el propio eje'],['Precesión','Cambio lento de orientación del eje'],['Afelio','Punto más lejano al Sol']],vocab:['Elipse','Foco','Órbita','Área barrida','Periodo orbital','Radio orbital','Rotación','Eje terrestre','Día y noche','Traslación','Año bisiesto','Estaciones','Equinoccio','Solsticio','Perihelio','Afelio','Precesión','Nutación','Esferoide','Achatamiento polar'],practice:'Con una lámpara y una pelota inclinada, modele rotación y traslación. Marque el ecuador y los polos; observe qué hemisferio recibe luz más directa en cuatro posiciones de la órbita.'},
{n:3,date:'5 al 9 de octubre',title:'Inclinación terrestre, vida y exploración del universo',pdf:'materiales-08/clase3/clase3-ciencias-8.pdf',imgs:['01-introduccion.png','02-infografia-general.png','03-inclinacion-del-eje.png','04-dia-noche-solsticio-equinoccio.png','05-latitud-y-zonas-climaticas.png','06-estaciones-y-epocas.png','07-reproduccion-y-migracion.png','08-hibernacion-y-estivacion.png','09-plantas-alimentacion-adaptacion.png','10-vida-cotidiana.png','11-exploracion-del-universo.png','12-resumen-final-con-llaves.png'],sections:[
 ['Eje inclinado y luz solar','El eje terrestre está inclinado 23,5° respecto a la perpendicular del plano orbital. Esta inclinación, no la distancia al Sol, explica las estaciones, los cambios en la duración del día y la noche y parte de la variedad climática.'],
 ['Latitud y zonas climáticas','Las zonas polares reciben luz oblicua y presentan grandes variaciones de iluminación. Las templadas tienen cuatro estaciones marcadas. La zona tropical recibe luz casi perpendicular y presenta menor variación de temperatura y duración del día.'],
 ['Efectos en los seres vivos','La luz, la lluvia y la temperatura influyen en reproducción, floración, alimentación y migración. La hibernación permite conservar energía durante el frío; la estivación es un reposo durante calor o sequía intensos.'],
 ['Vida cotidiana','La agricultura organiza siembra y cosecha según luz y lluvias. El turismo, la recreación y la salud también cambian con las estaciones o las épocas seca y lluviosa.'],
 ['Exploración del universo','La astronomía estudia los astros y las leyes del universo. La astronáutica diseña y opera vehículos espaciales. La astrofísica aplica la física al estudio de cuerpos celestes. Los conocimientos tradicionales también permitieron observar el cielo, organizar calendarios y orientar la agricultura.']
],mc:[['La inclinación del eje terrestre es de aproximadamente…',['5°','23,5°','90°'],1],['Panamá pertenece principalmente a la zona…',['Polar','Templada','Tropical'],2],['El reposo durante calor o sequía se llama…',['Hibernación','Estivación','Migración'],1],['La ciencia que estudia los astros es…',['Astronomía','Geología','Química'],0],['La astronáutica se ocupa principalmente de…',['Vehículos espaciales','Clasificar plantas','Estudiar reacciones'],0]],match:[['Solsticio','Momento de máxima diferencia entre día y noche'],['Equinoccio','Día y noche de duración aproximada igual'],['Migración','Desplazamiento estacional de animales'],['Hibernación','Reposo para conservar energía en el frío'],['Astrofísica','Física aplicada a cuerpos celestes']],vocab:['Inclinación del eje terrestre','Eje terrestre','Plano orbital','Solsticio','Equinoccio','Latitud','Zona polar','Zona templada','Zona tropical','Estaciones del año','Época seca','Época lluviosa','Migración','Reproducción estacional','Floración','Hibernación','Estivación','Astronomía','Astronáutica','Astrofísica','Cosmos','Sonda espacial','Satélite artificial','Conocimiento tradicional'],practice:'En equipos, elaboren un calendario de Panamá con época seca y lluviosa. Añadan ejemplos de cultivos, animales, actividades y condiciones de salud que cambian durante el año.'},
{n:4,date:'12 de octubre al 12 de noviembre',title:'Tecnología e historia de la exploración espacial',pdf:'materiales-08/clase4/clase4-ciencias-8.pdf',imgs:['01-introduccion.png','02-infografia-general.png','03-evolucion-del-telescopio.png','04-telescopios-modernos.png','05-tecnologias-espaciales.png','06-estaciones-y-transbordadores.png','07-carrera-espacial-1957-1969.png','08-estaciones-rovers-1971-2009.png','09-nueva-era-2010-2021.png','10-marte-destino-constante.png','11-misiones-y-descubrimientos.png','12-resumen-final-con-llaves.png'],sections:[
 ['Evolución del telescopio','En 1608 Hans Lippershey patentó el telescopio refractor. Galileo lo usó en 1609 para observar lunas de Júpiter, fases de Venus, manchas solares y montañas lunares. Newton diseñó el reflector en 1668. Hubble fue lanzado en 1990 y James Webb en 2021.'],
 ['Tecnologías espaciales','Los satélites apoyan comunicaciones, navegación y observación terrestre. Las sondas exploran sin tripulación. Los cohetes impulsan cargas al espacio. Las estaciones sirven como laboratorios de microgravedad y los transbordadores fueron naves tripuladas reutilizables.'],
 ['Carrera espacial','Sputnik 1 fue el primer satélite artificial (1957). Yuri Gagarin fue el primer humano en orbitar la Tierra (1961). Apollo 11 logró el primer alunizaje humano en 1969.'],
 ['Estaciones, sondas y rovers','Salyut 1 fue la primera estación espacial (1971); Mir fue modular y la EEI comenzó a construirse en 1998. Viking, Voyager, Galileo, Cassini-Huygens, New Horizons y los rovers marcianos ampliaron el conocimiento del sistema solar.'],
 ['Nueva era y descubrimientos','SpaceX llevó tripulaciones desde 2020 e Inspiration4 realizó un vuelo totalmente civil en 2021. Perseverance busca evidencias de vida pasada en Marte. Kepler y TESS descubren exoplanetas. James Webb observa en infrarrojo objetos muy distantes.']
],mc:[['Galileo usó el telescopio para astronomía en…',['1609','1957','2021'],0],['El primer satélite artificial fue…',['Hubble','Sputnik 1','Voyager 1'],1],['El primer alunizaje humano ocurrió en…',['1969','1990','2015'],0],['Un vehículo no tripulado de exploración es una…',['Sonda espacial','Estación','Astronauta'],0],['James Webb observa principalmente en…',['Infrarrojo','Sonido','Ondas del mar'],0]],match:[['Telescopio refractor','Utiliza lentes'],['Telescopio reflector','Utiliza un espejo cóncavo'],['Satélite artificial','Orbita para comunicar, navegar u observar'],['Rover','Vehículo que recorre otra superficie'],['Microgravedad','Condición investigada en estaciones espaciales']],vocab:['Telescopio','Telescopio refractor','Telescopio reflector','Telescopio Hubble','Telescopio James Webb','Radiotelescopio','Exoplaneta','Satélite artificial','Sonda espacial','Cohete','Estación espacial','Microgravedad','Transbordador espacial','Sputnik 1','Astronauta','Carrera espacial','Alunizaje','Rover marciano','Perseverance','Juno','Cassini-Huygens','Voyager 1','Observación infrarroja','Colaboración internacional'],practice:'Construyan una línea del tiempo de 1957 a 2021. Cada equipo escoge cinco hitos, explica qué tecnología se utilizó y argumenta cuál produjo el mayor cambio en la exploración espacial.'}
];

function gallery(c){return c.imgs.map((im,i)=>`<figure><img loading="lazy" src="materiales-08/clase${c.n}/explicacion/${im}" alt="${esc(c.title)}: imagen ${i+1}"><figcaption>Imagen explicativa ${i+1}</figcaption></figure>`).join('')}
function mc(c){return c.mc.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="c${c.n}q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}

function photo(c){return [0,1,2,3,4].map((_,i)=>`<div class="q"><img src="materiales-08/clase${c.n}/vocabulario/${String(i+1).padStart(2,'0')}.png" alt="Vocabulario ${i+1}" style="width:130px;aspect-ratio:1;object-fit:cover;border-radius:8px"><label><b>¿Qué término representa?</b><select name="p${i}"><option value="">Seleccione…</option>${c.vocab.slice(0,8).map(v=>`<option>${v}</option>`).join('')}</select></label></div>`).join('')}
function panel(c){return `<section class="panel ${c.n===1?'active':''}" id="clase${c.n}" data-n="${c.n}"><div class="topline"><span class="eyebrow">Ciencias · Clase 08 · Clase ${c.n}</span><span class="meta">${c.date}</span><button class="btn red speak">🔊 Escuchar esta clase</button><button class="btn black stop">■ Detener</button><a class="btn black" href="imagenes_ciencias_8.html?clase=${c.n}">🖼️ Ver clase en imágenes</a><a class="btn red" href="${c.pdf}" download>📄 Descargar PDF</a></div><section class="card taskbox"><h2>🧪 Ejercicios de práctica en casa — Clase ${c.n}</h2><div class="seccion-ejercicios-botones"><a class="btn green" href="ejercicios_ciencias_8.html?clase=${c.n}&tipo=multiple">📝 Ejercicio 1: Respuesta múltiple</a><a class="btn green" href="ejercicios_ciencias_8.html?clase=${c.n}&tipo=pareo">🔤 Ejercicio 2: Pareo de términos</a><a class="btn green" href="ejercicios_ciencias_8.html?clase=${c.n}&tipo=fotos">📷 Ejercicio 3: Pareo de fotos</a></div></section><section class="card classwork"><h2>🧪 Práctica en clase — Clase ${c.n}</h2><a class="btn green" href="practica_ciencias_8.html?clase=${c.n}">🧩 Práctica Clase ${c.n}</a><p style="margin-bottom:0">Incluye crucigrama, pareo y completar. La nota se muestra al finalizar los tres ejercicios.</p></section><article class="readable"><div class="card"><h2>${c.title}</h2><p class="notice">Lee, observa las imágenes y después completa las actividades. Puedes trabajar individualmente o con tu equipo.</p><div class="grid">${c.sections.map(s=>`<div class="fact"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></article><details class="card"><summary><b>🖼️ Vista rápida de imágenes (${c.imgs.length})</b></summary><div class="gallery">${gallery(c)}</div></details></section>`}
document.querySelector('#panels').innerHTML=C.map(panel).join('');
function openTab(n){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==n));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.n==n));history.replaceState(null,'','#clase'+n);scrollTo({top:0,behavior:'smooth'})}

document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();const t=b.closest('.panel').querySelector('.readable').innerText;const u=new SpeechSynthesisUtterance(t);u.lang='es-PA';u.rate=.92;speechSynthesis.speak(u)});document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>speechSynthesis.cancel());
document.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{const box=b.closest('.quiz'),n=+b.closest('.panel').dataset.n,c=C[n-1],names=box.querySelector('[name=names]').value.trim(),group=box.querySelector('[name=group]').value;if(!names||!group){alert('Escriba los integrantes y seleccione el grupo.');return}let e1=0,e2=0,e3=0,total=15;c.mc.forEach((q,i)=>{const a=box.querySelector(`input[name=c${n}q${i}]:checked`);if(a&&+a.value===q[2])e1++});c.match.forEach((q,i)=>{if(box.querySelector(`[name=m${i}]`).value===q[1])e2++});for(let i=0;i<5;i++){if(box.querySelector(`[name=p${i}]`).value===c.vocab[i])e3++}const ok=e1+e2+e3,grade=(1+4*ok/total).toFixed(1),msg=grade<3?'Puedes mejorar. Repasa nuevamente la clase y vuelve a intentarlo.':grade<=4?'Buen trabajo. Continúa practicando para mejorar.':'¡Excelente trabajo! Demostraste un gran dominio del tema.',now=new Date(),stamp=now.toLocaleString('es-PA',{dateStyle:'short',timeStyle:'short'}),text=`CIENCIAS NATURALES - SALÓN 08\nClase ${n}: ${c.title}\nFecha y hora: ${stamp}\nGrupo: ${group}\nIntegrantes: ${names}\nEjercicio 1: ${e1}/5\nEjercicio 2: ${e2}/5\nEjercicio 3: ${e3}/5\nTotal: ${ok} de ${total}\nCalificación: ${grade}/5.0\n${msg}`;const r=box.querySelector('.result');r.querySelector('.score').textContent=`Calificación: ${grade} / 5.0`;r.querySelector('.msg').innerHTML=`Ejercicio 1: ${e1}/5 · Ejercicio 2: ${e2}/5 · Ejercicio 3: ${e3}/5<br>${msg}`;r.querySelector('.wa').href='https://wa.me/50769262339?text='+encodeURIComponent(text);r.classList.add('show');r.scrollIntoView({behavior:'smooth',block:'center'})});
document.addEventListener('click',e=>{if(e.target.matches('.gallery img')){const m=document.querySelector('#modal');m.querySelector('img').src=e.target.src;m.classList.add('open')}if(e.target.matches('.close')||e.target.id==='modal')document.querySelector('#modal').classList.remove('open')});
