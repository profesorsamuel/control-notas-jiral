<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estadísticas de asistencia | Control de Notas</title>

    <link rel="icon" type="image/x-icon" href="../img/login-favicon.ico">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fa-solid fa-chart-column me-2" aria-hidden="true"></i>
                Estadísticas de asistencia
            </span>
            <div class="d-flex align-items-center text-white">
                <a href="admin.html" class="btn btn-outline-light btn-sm me-2">
                    <i class="fa-solid fa-arrow-left me-1"></i>Volver al panel
                </a>
                <span id="nombreAdmin" class="me-3 small"></span>
                <button id="btnCerrarSesion" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-right-from-bracket me-1" aria-hidden="true"></i>
                    Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div id="mensajeEstadisticas" class="alert d-none" role="alert"></div>

        <!-- ===================== RESUMEN ===================== -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card shadow-sm text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small">% Asistencia</div>
                        <div id="resPorcentajeAsistencia" class="h3 mb-0 fw-bold text-success">–</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small">Ausencias</div>
                        <div id="resAusencias" class="h3 mb-0 fw-bold text-danger">–</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small">Tardanzas</div>
                        <div id="resTardanzas" class="h3 mb-0 fw-bold text-warning">–</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm text-center h-100">
                    <div class="card-body">
                        <div class="text-muted small">Total registros</div>
                        <div id="resTotalRegistros" class="h3 mb-0 fw-bold text-secondary">–</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================== FILTROS ===================== -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-6 col-md-2">
                        <label for="filtroFechaDesde" class="form-label fw-semibold">
                            <i class="fa-solid fa-calendar me-1"></i> Desde
                        </label>
                        <input type="date" id="filtroFechaDesde" class="form-control">
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="filtroFechaHasta" class="form-label fw-semibold">
                            <i class="fa-solid fa-calendar me-1"></i> Hasta
                        </label>
                        <input type="date" id="filtroFechaHasta" class="form-control">
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="filtroSalon" class="form-label fw-semibold">
                            <i class="fa-solid fa-door-open me-1"></i> Salón
                        </label>
                        <select id="filtroSalon" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="filtroMateria" class="form-label fw-semibold">
                            <i class="fa-solid fa-book me-1"></i> Materia
                        </label>
                        <select id="filtroMateria" class="form-select">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="filtroProfesor" class="form-label fw-semibold">
                            <i class="fa-solid fa-chalkboard-user me-1"></i> Profesor
                        </label>
                        <select id="filtroProfesor" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2 d-flex gap-2">
                        <button type="button" id="btnAplicarFiltros" class="btn btn-primary w-100">
                            <i class="fa-solid fa-rotate me-1"></i> Aplicar
                        </button>
                        <button type="button" id="btnLimpiarFiltros" class="btn btn-outline-secondary w-100">
                            Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===================== GRÁFICAS ===================== -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <canvas id="graficaDistribucion"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <canvas id="graficaTopAsistencia"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <canvas id="graficaTopAusencias"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================== RANKINGS ===================== -->
        <div class="row g-3">
            <div class="col-md-6">
                <section class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0">
                            <i class="fa-solid fa-ranking-star me-2 text-success" aria-hidden="true"></i>
                            Top asistencia
                        </h2>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-center">#</th>
                                        <th>Estudiante</th>
                                        <th class="text-center">% Asistencia</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoRankingAsistencia">
                                    <tr><td colspan="3" class="text-center text-muted py-4">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>

            <div class="col-md-6">
                <section class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h2 class="h5 mb-0">
                            <i class="fa-solid fa-ranking-star me-2 text-danger" aria-hidden="true"></i>
                            Top ausencias
                        </h2>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="text-center">#</th>
                                        <th>Estudiante</th>
                                        <th class="text-center">Ausencias</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoRankingAusencias">
                                    <tr><td colspan="3" class="text-center text-muted py-4">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/estadisticas_asistencias.js"></script>

</body>

</html>
