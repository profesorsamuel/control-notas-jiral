<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi horario semanal · Centro Básico General El Jiral</title>

<link rel="icon" type="image/x-icon" href="../img/estudiante-favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #4b3fb3, #2f7bd1);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px 12px;
    }
    .tarjeta-principal {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .encabezado-horario {
        background: linear-gradient(90deg, #3a6fd8, #5a4fcf);
        color: #fff;
        padding: 18px 24px;
        text-align: center;
    }
    .encabezado-horario h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .info-salon { padding: 14px 24px; text-align: center; font-size: .95rem; color: #333; border-bottom: 1px solid #eee; }
    .barra-acciones { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #eee; }
    .contenedor-tabla { overflow-x: auto; padding: 16px; }
    table.tabla-horario { width: 100%; border-collapse: collapse; min-width: 720px; }
    table.tabla-horario th {
        background: #5a4fcf; color: #fff; padding: 10px 8px; font-size: .85rem; text-align: center;
    }
    table.tabla-horario td {
        border: 1px solid #eee; padding: 6px; vertical-align: top; text-align: center; font-size: .82rem;
        min-width: 110px; height: 62px;
    }
    td.col-hora { background: #f3f4fb; color: #444; font-weight: 600; white-space: nowrap; }
    tr.fila-recreo td { background: #f5a623; color: #fff; font-weight: 700; text-align: center; }
    .celda-bloque {
        border-radius: 8px; padding: 6px; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
    }
    .celda-bloque.tipo-clase { background: #e8ecfb; color: #2f3ea3; }
    .celda-bloque.tipo-otro { background: #fdeee0; color: #c0530a; }
    .celda-vacia { height: 100%; }
    #estadoHorario { text-align: center; padding: 6px 24px 16px; font-size: .85rem; min-height: 20px; }
</style>
</head>
<body>

<div class="tarjeta-principal">
    <div class="encabezado-horario">
        <h1>📅 Mi horario de la semana</h1>
    </div>

    <div class="info-salon">
        🏫 Salón: <strong id="textoSalon">—</strong>
    </div>

    <div class="barra-acciones">
        <a href="estudiante.html" class="btn btn-outline-secondary btn-sm">↩️ Regresar a mis notas</a>
        <a href="alerta_horario.html" class="btn btn-outline-primary btn-sm">🔔 Ver solo el horario de hoy</a>
    </div>

    <div class="contenedor-tabla">
        <table class="tabla-horario" id="tablaHorario">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaHorario">
                <tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="estadoHorario"></div>
</div>

<script type="module" src="../js/horario_semanal.js"></script>
</body>
</html>
