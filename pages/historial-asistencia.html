<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial de asistencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182849;
    --ink-soft:#4b5773;
    --paper:#eef1f6;
    --paper-card:#ffffff;
    --rule:#c9d0e0;
    --margin-line:#c65a4a;
    --gold:#c1892e;
    --teal:#2f6f6b;
    --rose:#b8483f;
    --amber:#c1892e;
    --blue:#3160a8;
    --radius:10px;
    --shadow:0 1px 2px rgba(24,40,73,.06), 0 8px 24px -12px rgba(24,40,73,.18);
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    padding-left:clamp(18px, 4vw, 56px);
    position:relative;
  }

  /* Línea de margen tipo cuaderno escolar — elemento distintivo de la página */
  body::before{
    content:"";
    position:fixed;
    top:0;
    bottom:0;
    left:clamp(10px, 2.6vw, 34px);
    width:2px;
    background:var(--margin-line);
    opacity:.55;
  }

  .envoltura{
    max-width:980px;
    margin:0 auto;
    padding:38px 22px 64px;
  }

  .btn-volver{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
    padding:6px 2px;
    margin-bottom:16px;
    border:none;
    background:transparent;
  }
  .btn-volver:hover{ color:var(--ink); }
  .btn-volver svg{ width:14px; height:14px; }

  header.encabezado{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 20px;
    margin-bottom:28px;
    padding-bottom:18px;
    border-bottom:1px solid var(--rule);
  }

  .eyebrow{
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 6px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px, 3.4vw, 34px);
    margin:0;
    letter-spacing:-.01em;
  }

  .tarjeta-profesor{
    text-align:right;
  }

  .tarjeta-profesor .etiqueta{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 3px;
  }

  .tarjeta-profesor .nombre{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }

  /* ============ BARRA DE ACCIONES (exportar trimestre) ============ */
  .barra-acciones{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }

  .btn-trimestre{
    background:var(--gold);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:10px 18px;
    font-size:14px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background .15s ease, transform .12s ease;
  }
  .btn-trimestre:hover{ background:#a8781f; }
  .btn-trimestre:active{ transform:translateY(1px); }
  .btn-trimestre:disabled{ opacity:.6; cursor:progress; }

  /* ============ FILTROS ============ */
  .panel-filtros{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    display:flex;
    flex-wrap:wrap;
    align-items:end;
    gap:16px 22px;
    margin-bottom:22px;
  }

  .campo{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:150px;
    flex:1 1 150px;
  }

  .campo label{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  input[type="date"], select{
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:7px;
    padding:9px 10px;
    outline-offset:2px;
  }

  input[type="date"]:focus, select:focus{
    outline:2px solid var(--blue);
  }

  .campo-accion{
    flex:0 0 auto;
  }

  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }

  .btn-tomar-asistencia{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    transition:transform .12s ease, background .15s ease;
  }
  .btn-tomar-asistencia:hover{ background:#233258; }
  .btn-tomar-asistencia:active{ transform:translateY(1px); }

  .btn-secundario{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--rule);
  }
  .btn-secundario:hover{ background:var(--paper); color:var(--ink); }

  /* ============ ESTADO / RESULTADOS ============ */
  #estadoHistorial{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 12px 2px;
  }

  /* ============ TABLA ============ */
  .tabla-envoltura{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:28px;
  }

  table{
    width:100%;
    border-collapse:collapse;
  }

  thead th{
    text-align:left;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    padding:13px 16px;
    border-bottom:1px solid var(--rule);
    background:#f7f8fb;
  }

  tbody td{
    padding:13px 16px;
    border-bottom:1px solid #eef0f5;
    font-size:14.5px;
  }

  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#f9fafc; }

  tbody td:first-child{ font-weight:600; }

  .btn-ver-detalle{
    background:transparent;
    color:var(--blue);
    border:1px solid #c7d5ef;
    padding:6px 12px;
    font-size:13px;
    font-weight:600;
    border-radius:6px;
  }
  .btn-ver-detalle:hover{ background:#eef3fc; }

  /* ============ DETALLE ============ */
  .panel-detalle{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 24px 26px;
  }

  .panel-detalle h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 4px;
  }

  .meta-detalle{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 18px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--rule);
  }

  .meta-detalle strong{ color:var(--ink); font-weight:600; }

  .panel-detalle table{ margin-bottom:20px; }
  .panel-detalle thead th{ background:transparent; padding-left:0; padding-right:12px; }
  .panel-detalle tbody td{ padding-left:0; padding-right:12px; }

  .acciones-detalle{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  #opcionesExportar{
    display:flex;
    gap:6px;
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:6px;
    box-shadow:var(--shadow);
  }

  #opcionesExportar button{
    background:transparent;
    border:none;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:6px 10px;
    border-radius:5px;
  }
  #opcionesExportar button:hover{ background:var(--paper); }

  /* ============ ALERTAS DE ASISTENCIA ============ */
  .panel-alertas{
    background:#fff8f2;
    border:1px solid #f0d3ba;
    border-left:4px solid var(--rose);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-bottom:22px;
  }

  .panel-alertas h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  #metaAlertas{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }

  .lista-alertas{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .lista-alertas li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 12px;
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:10px 14px;
  }

  .nombre-alerta{
    font-weight:600;
    font-size:14.5px;
  }

  .badges-alerta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .badge-alerta{
    font-size:12.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    background:#f0f1f5;
    color:var(--ink-soft);
  }

  .badge-alerta.badge-fuerte.badge-tardanza{
    background:#fdf0da;
    color:#9a6a12;
  }

  .badge-alerta.badge-fuerte.badge-ausencia{
    background:#fbe7e5;
    color:var(--rose);
  }

  @media (max-width:640px){
    .panel-filtros{ flex-direction:column; align-items:stretch; }
    .campo{ min-width:0; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    tbody tr{ padding:12px 16px; border-bottom:1px solid var(--rule); }
    tbody td{ border:none; padding:4px 0; }
    tbody td::before{
      content:attr(data-etiqueta);
      display:block;
      font-size:10.5px;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--ink-soft);
      font-weight:600;
    }
  }
</style>
</head>
<body>
<div class="envoltura">

  <a href="asistencia.html" class="btn-volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Volver a mi página
  </a>

  <header class="encabezado">
    <div>
      <p class="eyebrow">Registro docente</p>
      <h1>Historial de asistencias</h1>
    </div>
    <div class="tarjeta-profesor">
      <p class="etiqueta">Profesor</p>
      <p class="nombre" id="nombreProfesorTop">—</p>
    </div>
  </header>

  <div class="barra-acciones">
    <div></div>
    <button type="button" id="btnExportarTrimestre" class="btn-trimestre">🖨️ Imprimir asistencia del trimestre</button>
  </div>

  <!-- =========================================================
       FILTROS
  ========================================================= -->
  <div class="panel-filtros" id="panelFiltros">
      <div class="campo">
          <label for="filtroFecha">Fecha</label>
          <input type="date" id="filtroFecha">
      </div>
      <div class="campo">
          <label for="filtroSalon">Salón</label>
          <select id="filtroSalon">
              <option value="">Todos los salones</option>
          </select>
      </div>
      <div class="campo">
          <label for="filtroMateria">Materia</label>
          <select id="filtroMateria">
              <option value="">Todas las materias</option>
          </select>
      </div>
      <div class="campo">
          <label for="filtroProfesor">Profesor</label>
          <select id="filtroProfesor">
              <option value="">Todos los profesores</option>
          </select>
      </div>
      <div class="campo campo-accion">
          <button type="button" id="btnLimpiarFiltros" class="btn-tomar-asistencia btn-secundario">Limpiar filtros</button>
      </div>
  </div>

  <p id="estadoHistorial"></p>

  <!-- =========================================================
       ALERTAS: tardanzas frecuentes o ausencias sin justificar
  ========================================================= -->
  <div class="panel-alertas" id="panelAlertas" style="display:none;">
      <h2>⚠️ Estudiantes que requieren atención</h2>
      <p id="metaAlertas"></p>
      <ul id="listaAlertas" class="lista-alertas"></ul>
  </div>

  <!-- =========================================================
       TABLA DE RESULTADOS
  ========================================================= -->
  <div class="tabla-envoltura">
    <table id="tablaHistorial">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Materia</th>
                <th>Salón</th>
                <th>Profesor</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="cuerpoTablaHistorial"></tbody>
    </table>
  </div>

  <!-- =========================================================
       DETALLE DE UNA ASISTENCIA (oculto hasta hacer clic en "Ver detalle")
  ========================================================= -->
  <div id="panelDetalle" class="panel-detalle" style="display:none;">
      <h2>Detalle</h2>
      <p class="meta-detalle">
          <strong>Fecha:</strong> <span id="detalleFecha"></span> ·
          <strong>Materia:</strong> <span id="detalleMateria"></span> ·
          <strong>Salón:</strong> <span id="detalleSalon"></span> ·
          <strong>Profesor:</strong> <span id="detalleProfesor"></span>
      </p>
      <table>
          <thead>
              <tr>
                  <th>Estudiante</th>
                  <th>Estado</th>
                  <th>Observación / Justificación</th>
                  <th>Adjunto</th>
              </tr>
          </thead>
          <tbody id="cuerpoTablaDetalle"></tbody>
      </table>
      <div class="acciones-detalle">
        <div style="position:relative; display:inline-block;">
            <button type="button" id="btnExportar" class="btn-tomar-asistencia">⬇ Exportar</button>
            <div id="opcionesExportar" style="display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:10;">
                <button type="button" id="btnExportarPDF">PDF</button>
                <button type="button" id="btnExportarExcel">Excel</button>
                <button type="button" id="btnExportarCSV">CSV</button>
            </div>
        </div>
        <button type="button" id="btnCerrarDetalle" class="btn-tomar-asistencia btn-secundario">Cerrar detalle</button>
      </div>
  </div>

</div>
<script type="module" src="../js/historial-asistencia.js"></script>
</body>
</html>
