<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clase en imágenes · Ciencias 8.º</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#111;font:16px/1.5 Georgia,serif}main{max-width:1100px;margin:auto;padding:24px 16px}.ey{color:#e30613;font:800 12px Arial;letter-spacing:1.2px;text-transform:uppercase}h1{font:800 clamp(25px,5vw,38px) Arial;margin:.3rem 0}h1 span{color:#e30613}.btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:10px 16px;border-radius:22px;font:800 14px Arial}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;margin-top:20px}figure{margin:0;background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #0001}img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}figcaption{padding:10px;font:700 13px Arial}.modal{display:none;position:fixed;inset:0;background:#000e;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal img{max-width:96vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:20px;top:10px;color:#fff;font:40px Arial;cursor:pointer}</style></head><body><main><div class="ey">Ciencias Naturales · Salón 08</div><h1>Clase <span id="num"></span> en imágenes</h1><p id="title"></p><a id="back" class="btn">← Volver a la clase</a><div id="grid" class="grid"></div></main><div id="modal" class="modal"><span class="close">×</span><img alt="Imagen ampliada"></div><script>
const D={1:{t:'Transformaciones y reacciones químicas',f:['01-introduccion.png','02-infografia-general.png','03-transformaciones-quimicas.png','04-energia-en-las-reacciones.png','05-reversibles-e-irreversibles.png','06-ecuacion-quimica.png','07-combustion.png','08-fermentacion-y-oxidacion.png','09-numero-de-oxidacion.png','10-esquema-final-con-llaves.png']},2:{t:'Leyes de Kepler y movimientos de la Tierra',f:['01-introduccion.png','02-infografia-general.png','03-tres-leyes-de-kepler.png','04-primera-ley-orbitas.png','05-segunda-ley-areas.png','06-tercera-ley-periodos.png','07-rotacion-y-traslacion.png','08-estaciones-del-ano.png','09-perihelio-y-afelio.png','10-precesion-y-nutacion.png','11-forma-real-de-la-tierra.png','12-esquema-final.png']},3:{t:'Inclinación terrestre, vida y exploración del universo',f:['01-introduccion.png','02-infografia-general.png','03-inclinacion-del-eje.png','04-dia-noche-solsticio-equinoccio.png','05-latitud-y-zonas-climaticas.png','06-estaciones-y-epocas.png','07-reproduccion-y-migracion.png','08-hibernacion-y-estivacion.png','09-plantas-alimentacion-adaptacion.png','10-vida-cotidiana.png','11-exploracion-del-universo.png','12-resumen-final-con-llaves.png']},4:{t:'Tecnología e historia de la exploración espacial',f:['01-introduccion.png','02-infografia-general.png','03-evolucion-del-telescopio.png','04-telescopios-modernos.png','05-tecnologias-espaciales.png','06-estaciones-y-transbordadores.png','07-carrera-espacial-1957-1969.png','08-estaciones-rovers-1971-2009.png','09-nueva-era-2010-2021.png','10-marte-destino-constante.png','11-misiones-y-descubrimientos.png','12-resumen-final-con-llaves.png']}};const n=Math.min(4,Math.max(1,+new URLSearchParams(location.search).get('clase')||1)),d=D[n];document.querySelector('#num').textContent=n;document.querySelector('#title').textContent=d.t;document.querySelector('#back').href=`salon08-unidad-completa.html#clase${n}`;document.querySelector('#grid').innerHTML=d.f.map((f,i)=>`<figure><img loading="lazy" src="materiales-08/clase${n}/explicacion/${f}" alt="Imagen explicativa ${i+1}"><figcaption>${String(i+1).padStart(2,'0')}. ${f.replace(/^\d+-|\.png$/g,'').replaceAll('-',' ')}</figcaption></figure>`).join('');document.addEventListener('click',e=>{const m=document.querySelector('#modal');if(e.target.matches('#grid img')){m.querySelector('img').src=e.target.src;m.classList.add('open')}if(e.target.matches('.close')||e.target===m)m.classList.remove('open')});
</script><script src="../js/visor_imagenes_zoom.js"></script></body></html>
