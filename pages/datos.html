<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Datos - Control de Notas</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../img/datos-favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/datos-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/datos-favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/datos-apple-touch-icon.png">

    <!-- Vista previa al compartir el enlace -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mis Datos | Control de Notas - C.E.B.G. El Jiral">
    <meta property="og:description" content="Completa tu información y la de tus acudientes en el sistema de Control de Notas.">
    <meta property="og:image" content="https://notasjiral.netlify.app/img/datos-og-image.jpg">
    <meta property="og:url" content="https://notasjiral.netlify.app/pages/datos.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://notasjiral.netlify.app/img/datos-og-image.jpg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;
        }

        .tarjeta {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 25px;
        }

        .encabezado h1 {
            margin: 0;
            color: #1e3a8a;
            font-size: 24px;
        }

        .encabezado p {
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
        }

        .grupo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .mensaje {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            line-height: 1.4;
        }

        .exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            text-decoration: underline;
        }

        .separador {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 22px 0 18px;
        }

        .subtitulo {
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="encabezado">
                <h1>📋 Mis Datos</h1>
                <p>Completa la información del estudiante y sus acudientes.</p>
            </div>

            <form id="datosForm">

                <div class="subtitulo">Datos del estudiante</div>

                <div class="grupo">
                    <label for="nombreApellido">Nombre y apellido</label>
                    <input type="text" id="nombreApellido" required>
                </div>

                <div class="grupo">
                    <label for="cedula">Cédula</label>
                    <input type="text" id="cedula" placeholder="8-123-4567" required>
                </div>

                <div class="grupo">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>

                <div class="grupo">
                    <label for="celularEstudiante">Celular del estudiante</label>
                    <input type="tel" id="celularEstudiante" placeholder="6000-0000">
                </div>

                <hr class="separador">

                <div class="subtitulo">Datos de los acudientes</div>

                <div class="grupo">
                    <label for="nombrePadreAcudiente">Nombre del padre / acudiente</label>
                    <input type="text" id="nombrePadreAcudiente" required>
                </div>

                <div class="grupo">
                    <label for="celularAcudiente1">Celular del acudiente 1</label>
                    <input type="tel" id="celularAcudiente1" placeholder="6000-0000" required>
                </div>

                <div class="grupo">
                    <label for="telefonoAcudiente2">Teléfono del acudiente 2</label>
                    <input type="tel" id="telefonoAcudiente2" placeholder="6000-0000">
                </div>

                <div class="grupo">
                    <label for="correoContacto">Correo electrónico de contacto</label>
                    <input type="email" id="correoContacto" placeholder="familia@correo.com">
                </div>

                <button type="submit" id="btnGuardarDatos">
                    💾 Guardar datos
                </button>

                <div id="mensaje" class="mensaje" role="alert"></div>

            </form>

            <a href="estudiante.html" class="volver">← Volver al panel</a>

        </div>

    </div>

    <script type="module" src="../js/datos.js"></script>

</body>
</html>
