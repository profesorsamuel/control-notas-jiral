.wrap{max-width:900px}.exercise{background:#fff;border:1px solid #dce0e4;border-radius:14px;padding:22px;margin:18px 0}.question{background:#f7f7f7;border-left:5px solid #e30613;border-radius:8px;padding:15px;margin:13px 0}.question label{display:block;margin:8px 0;font-weight:400}.photo{width:min(280px,100%);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px;display:block;margin-bottom:12px;cursor:zoom-in}.saved{padding:12px;border-radius:8px;background:#eaf8ef;color:#12652f;font-weight:700}.saved.error{background:#fff1f1;color:#9f1b1b}.grade-big{font:900 54px Arial;color:#168443}.back{display:inline-block;margin-top:14px;color:#111;font-weight:700}#exercise,#result{display:none}
</style></head><body><div class="wrap"><header class="ph-header"><img class="ph-escudo" src="../img/escudo-jiral.png" alt="Escudo"><div><p class="ph-escuela">C.E.B.G. EL JIRAL · CIENCIAS 8.º A</p><h1 id="page-title">Ejercicio en casa</h1></div></header>
<section id="register" class="card"><p class="tag">REGISTRO OBLIGATORIO</p><h2>Identifícate antes de comenzar</h2><p class="lead">Selecciona tu nombre. La cédula registrada aparecerá automáticamente y tu calificación quedará guardada al finalizar.</p><label>Salón<select disabled><option>8A</option></select></label><label>Nombre<select id="student" disabled><option>Cargando estudiantes…</option></select></label><label>Cédula<input id="idcard" disabled placeholder="Cédula registrada"></label><p id="reg-error" class="error" hidden></p><button id="start" class="wide" disabled>Comenzar ejercicio</button><a class="back back-class">← Volver a la clase</a></section>
<section id="exercise" class="exercise"><p class="tag" id="tag"></p><h1 id="exercise-title"></h1><p id="topic" class="lead"></p><p id="active-student" class="saved"></p><div id="questions"></div><button id="grade" class="wide">Finalizar y guardar mi nota</button></section>
<section id="result" class="card"><p class="tag">RESULTADO</p><div id="final-grade" class="grade-big"></div><h2 id="final-message"></h2><p id="final-detail" class="lead"></p><p id="save-status" class="saved">Guardando…</p><button id="retry">Volver a intentar</button> <a class="back back-class">← Volver a la clase</a></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/portal-config.js"></script><script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const D={1:{title:'Transformaciones y reacciones químicas',mc:[['En una reacción química, las sustancias iniciales se llaman…',['Productos','Reactivos','Coeficientes'],1],['Una reacción que libera calor es…',['Endotérmica','Reversible','Exotérmica'],2],['¿Qué se conserva durante una reacción?',['La materia y los átomos','El color','La temperatura'],0],['Al balancear una ecuación se modifican…',['Los subíndices','Los coeficientes','Los símbolos químicos'],1],['La herrumbre es un ejemplo de…',['Oxidación','Fermentación','Fusión'],0]],match:[['Reactivo','Sustancia presente antes de la reacción'],['Producto','Sustancia nueva formada'],['Endotérmica','Absorbe energía'],['Exotérmica','Libera energía'],['Combustión','Reacción con combustible y comburente']],v:['Transformación química','Reactivo','Producto','Enlace químico','Conservación de la materia']},2:{title:'Leyes de Kepler y movimientos de la Tierra',mc:[['Según Kepler, las órbitas planetarias son…',['Cuadradas','Elípticas','Rectas'],1],['El planeta se mueve más rápido cuando está…',['Más cerca del Sol','Más lejos del Sol','En el centro'],0],['La rotación produce…',['Las estaciones','El día y la noche','El año bisiesto'],1],['La causa principal de las estaciones es…',['La inclinación del eje','El tamaño del Sol','La Luna'],0],['La forma real de la Tierra es…',['Cubo','Esferoide','Disco plano'],1]],match:[['Elipse','Curva cerrada con dos focos'],['Periodo orbital','Tiempo de una vuelta alrededor del Sol'],['Rotación','Giro sobre el propio eje'],['Precesión','Cambio lento de orientación del eje'],['Afelio','Punto más lejano al Sol']],v:['Elipse','Foco','Órbita','Área barrida','Periodo orbital']},3:{title:'Inclinación terrestre, vida y exploración del universo',mc:[['La inclinación del eje terrestre es de aproximadamente…',['5°','23,5°','90°'],1],['Panamá pertenece principalmente a la zona…',['Polar','Templada','Tropical'],2],['El reposo durante calor o sequía se llama…',['Hibernación','Estivación','Migración'],1],['La ciencia que estudia los astros es…',['Astronomía','Geología','Química'],0],['La astronáutica se ocupa principalmente de…',['Vehículos espaciales','Clasificar plantas','Estudiar reacciones'],0]],match:[['Solsticio','Momento de máxima diferencia entre día y noche'],['Equinoccio','Día y noche de duración aproximada igual'],['Migración','Desplazamiento estacional de animales'],['Hibernación','Reposo para conservar energía en el frío'],['Astrofísica','Física aplicada a cuerpos celestes']],v:['Inclinación del eje terrestre','Eje terrestre','Plano orbital','Solsticio','Equinoccio']},4:{title:'Tecnología e historia de la exploración espacial',mc:[['Galileo usó el telescopio para astronomía en…',['1609','1957','2021'],0],['El primer satélite artificial fue…',['Hubble','Sputnik 1','Voyager 1'],1],['El primer alunizaje humano ocurrió en…',['1969','1990','2015'],0],['Un vehículo no tripulado de exploración es una…',['Sonda espacial','Estación','Astronauta'],0],['James Webb observa principalmente en…',['Infrarrojo','Sonido','Ondas del mar'],0]],match:[['Telescopio refractor','Utiliza lentes'],['Telescopio reflector','Utiliza un espejo cóncavo'],['Satélite artificial','Orbita para comunicar, navegar u observar'],['Rover','Vehículo que recorre otra superficie'],['Microgravedad','Condición investigada en estaciones espaciales']],v:['Telescopio','Telescopio refractor','Telescopio reflector','Telescopio Hubble','Telescopio James Webb']}};
const p=new URLSearchParams(location.search),cl=Math.min(4,Math.max(1,+p.get('clase')||1)),type=['multiple','pareo','fotos'].includes(p.get('tipo'))?p.get('tipo'):'multiple',d=D[cl],labels={multiple:'Ejercicio 1: Respuesta múltiple',pareo:'Ejercicio 2: Pareo de términos',fotos:'Ejercicio 3: Pareo de fotos'},types={multiple:'quiz',pareo:'pareo',fotos:'fotos'},code=`cn8a-clase${cl}-2026`;let current=null,started=0;
document.querySelector('#page-title').textContent=`Clase ${cl} · ${labels[type]}`;document.querySelector('#tag').textContent=`CLASE ${cl} · ${labels[type]}`;document.querySelector('#exercise-title').textContent=labels[type];document.querySelector('#topic').textContent=d.title;document.querySelectorAll('.back-class').forEach(a=>a.href=`salon08-unidad-completa.html#clase${cl}`);
const digits=v=>String(v||'').replace(/\D/g,'');function error(t){const e=document.querySelector('#reg-error');e.textContent=t;e.hidden=false}
async function loadStudents(){const s=document.querySelector('#student'),{data,error:e}=await sb.from('estudiantes').select('id,nombre,cedula').eq('salon','8A').order('nombre');if(e){s.innerHTML='<option>No se pudo cargar</option>';error('No se pudo conectar con la lista de 8.º A.');return}s.innerHTML='<option value="">Selecciona tu nombre…</option>'+(data||[]).map(x=>`<option value="${x.id}" data-name="${String(x.nombre).replace(/"/g,'&quot;')}" data-idcard="${x.cedula||''}">${x.nombre}</option>`).join('');s.disabled=false;document.querySelector('#start').disabled=false}
document.querySelector('#student').onchange=e=>{document.querySelector('#idcard').value=e.target.selectedOptions[0]?.dataset.idcard||'';document.querySelector('#reg-error').hidden=true};document.querySelector('#start').onclick=()=>{const o=document.querySelector('#student').selectedOptions[0];if(!o?.value)return error('Selecciona tu nombre.');if(!o.dataset.idcard)return error('Este estudiante no tiene cédula registrada.');current={id:o.value,name:o.dataset.name,idcard:digits(o.dataset.idcard)};localStorage.setItem(`practice_${code}`,JSON.stringify(current));begin()};
function mix(a){return [...a].sort(()=>Math.random()-.5)}function begin(){document.querySelector('#register').style.display='none';document.querySelector('#result').style.display='none';document.querySelector('#exercise').style.display='block';document.querySelector('#active-student').textContent=`👤 ${current.name} · 8.º A`;started=Date.now();render()}
function render(){const q=document.querySelector('#questions');if(type==='multiple')q.innerHTML=d.mc.map((x,i)=>`<div class="question"><b>${i+1}. ${x[0]}</b>${x[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('');if(type==='pareo'){const opts=mix(d.match.map(x=>x[1]));q.innerHTML=d.match.map((x,i)=>`<div class="question"><label><b>${i+1}. ${x[0]}</b><select name="q${i}"><option value="">Seleccione…</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></label></div>`).join('')}if(type==='fotos'){const opts=mix(d.v);q.innerHTML=d.v.map((x,i)=>`<div class="question"><img class="photo" src="materiales-08/clase${cl}/vocabulario/${String(i+1).padStart(2,'0')}.png" alt="Imagen ${i+1}"><label><b>${i+1}. Selecciona el término representado</b><select name="q${i}"><option value="">Seleccione…</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></label></div>`).join('')}}
function check(){let ok=0,answers=[];if(type==='multiple')d.mc.forEach((x,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`),good=!!a&&+a.value===x[2];if(good)ok++;answers.push({question:x[0],answer:a?.value??null,correct:good})});if(type==='pareo')d.match.forEach((x,i)=>{const a=document.querySelector(`[name=q${i}]`).value,good=a===x[1];if(good)ok++;answers.push({term:x[0],answer:a,correct:good})});if(type==='fotos')d.v.forEach((x,i)=>{const a=document.querySelector(`[name=q${i}]`).value,good=a===x;if(good)ok++;answers.push({image:i+1,answer:a,correct:good})});return{ok,answers}}
document.querySelector('#grade').onclick=async()=>{if(!confirm('¿Deseas finalizar? Tu nota quedará guardada automáticamente.'))return;const {ok,answers}=check(),pct=Math.round(ok/5*100),note=pct>=91?5:pct>=81?4.5:pct>=71?4:pct>=61?3.5:pct>=51?3:pct>=41?2.5:pct>=31?2:pct>=21?1.5:1,finished=new Date();document.querySelector('#exercise').style.display='none';document.querySelector('#result').style.display='block';document.querySelector('#final-grade').textContent=note.toFixed(1);document.querySelector('#final-message').textContent=note<3?'Puedes mejorar':note<=4?'¡Buen trabajo!':'¡Excelente trabajo!';document.querySelector('#final-detail').textContent=`${ok} respuestas correctas de 5 (${pct} %).`;const status=document.querySelector('#save-status'),payload={codigo_examen:code,tipo_ejercicio:types[type],cedula:current.idcard,nombre:current.name,salon:'8A',preguntas_ids:[1,2,3,4,5],respuestas:answers,correctas:ok,incorrectas:5-ok,porcentaje:pct,nota_meduca:note,tiempo_total_seg:Math.round((Date.now()-started)/1000),iniciado_at:new Date(started).toISOString(),finalizado_at:finished.toISOString()};const {error:e}=await sb.from('prueba_intentos_practica').upsert(payload,{onConflict:'codigo_examen,tipo_ejercicio,cedula'});if(e){console.error(e);status.textContent='⚠️ No se pudo guardar. Revisa la conexión y vuelve a intentarlo.';status.className='saved error'}else status.textContent='✅ Calificación guardada automáticamente. Ya aparecerá en “Ver mis notas”.';window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('#retry').onclick=begin;loadStudents();
</script><script src="../js/visor_imagenes_zoom.js"></script><script src="../js/rastreador_practica.js?v=20260915-1"></script></body></html>
