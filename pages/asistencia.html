<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia</title>

    <link rel="icon" type="image/x-icon" href="../img/profesor-favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/profesor-favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/profesor-favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/profesor-apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Asistencia | Control de Notas - C.E.B.G. El Jiral">
    <meta property="og:description" content="Toma la asistencia de tus estudiantes por salón y materia.">
    <meta property="og:image" content="https://notasjiral.netlify.app/img/profesor-og-image.jpg">
    <meta property="og:url" content="https://notasjiral.netlify.app/pages/asistencia.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://notasjiral.netlify.app/img/profesor-og-image.jpg">

    <!-- Bootstrap: mismas clases usadas en el resto del sistema -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tipografía propia: Baloo 2 para títulos + Inter para texto,
         igual que en el resto del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Candado general: nada en la página puede hacer que el ancho
           total se salga del celular. */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        /* ============ Misma paleta que el resto del sistema ============ */
        :root {
            --color-fondo: #faf6ee;
            --color-panel: #ffffff;
            --color-primario: #2f6f62;
            --color-primario-oscuro: #234f45;
            --color-primario-claro: #e3efec;
            --color-acento: #cf8b2c;
            --color-acento-oscuro: #a86f1f;
            --color-texto: #2c2620;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            padding: 20px;
            background: var(--color-fondo);
            color: var(--color-texto);
        }

        h1, h2 {
            font-family: 'Baloo 2', 'Inter', Arial, sans-serif;
        }
        h1 { color: var(--color-primario); font-weight: 700; }
        h2 { color: var(--color-primario); font-size: 1.2rem; margin-top: 30px; font-weight: 600; }

        .panel-blanco {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .dato-fila {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .dato-fila strong { color: var(--color-primario); min-width: 110px; }

        .form-notas-fila {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-notas-fila > div { display: flex; flex-direction: column; gap: 4px; }
        .form-notas-fila label { font-size: 13px; font-weight: bold; color: var(--color-primario); }
        .form-notas-fila select, .form-notas-fila input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            min-width: 200px;
        }

        #btnAbrirAsistencia {
            padding: 10px 20px;
            background: var(--color-primario);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
        }
        #btnAbrirAsistencia:hover { background: var(--color-primario-oscuro); }
        #btnAbrirAsistencia:disabled { background: #b9c4c1; cursor: not-allowed; }

        #estadoCargaAsistencia { font-size: 13px; color: #888; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .panel-blanco { padding: 12px; }
            h1 { font-size: 1.25rem; }
            .form-notas-fila { flex-direction: column; align-items: stretch; gap: 10px; }
            .form-notas-fila > div { width: 100%; }
            .form-notas-fila select, .form-notas-fila input { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>

<body>

    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>📋 Asistencia</h1>
        <span id="navCambiarPanel"></span>
    </div>

    <div class="panel-blanco">
        <div class="dato-fila"><strong>📅 Fecha:</strong> <span id="fechaActual">Cargando...</span></div>
        <div class="dato-fila"><strong>👨‍🏫 Profesor:</strong> <span id="nombreProfesorTexto">Cargando...</span></div>
    </div>

    <div id="avisoSinAsignaciones" class="panel-blanco" style="display:none; color:#dc3545;">
        Todavía no tienes materias ni salones asignados. Pídele al administrador que te
        agregue en la pantalla de "Asignaciones de profesores".
    </div>

    <div class="panel-blanco">
        <div class="form-notas-fila">
            <div>
                <label for="selectSalonAsistencia">Salón</label>
                <select id="selectSalonAsistencia"><option value="">Cargando...</option></select>
            </div>
            <div>
                <label for="selectMateriaAsistencia">Materia</label>
                <select id="selectMateriaAsistencia" disabled><option value="">Seleccione primero un salón</option></select>
            </div>
        </div>

        <button type="button" id="btnAbrirAsistencia" disabled>📋 Abrir Asistencia</button>
        <div><span id="estadoCargaAsistencia"></span></div>
    </div>

    <script type="module" src="../js/asistencia.js"></script>

</body>

</html>
